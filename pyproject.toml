[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bcpnm"
version = "0.1.0"
description = "Blume–Capel probabilistic network modeling for psychological systems: Boolean, multi-valued and probabilistic network dynamics, attractors, perturbations and inference."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The bcpnm authors" }]
keywords = ["network psychometrics", "Boolean networks", "Blume-Capel", "attractors", "complex systems", "psychology", "silence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "networkx>=2.8",
  "matplotlib>=3.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
notebooks = ["jupyter", "nbclient>=0.7", "nbformat>=5.7", "ipykernel"]
dev = ["pytest>=7", "build", "nbclient>=0.7", "nbformat>=5.7", "ipykernel"]

[project.urls]
Homepage = "https://github.com/YOUR-ORG/bcpnm"
Documentation = "https://github.com/YOUR-ORG/bcpnm/tree/main/docs"
Issues = "https://github.com/YOUR-ORG/bcpnm/issues"

[tool.setuptools]
packages = ["bcpnm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
